<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    background-color: #f7f4ed;
    background-image: url("assets/paper.png");
    background-repeat: repeat;
    background-size: 512px 512px;
    color: #d24942;
    font-family: "Courier Prime", "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  /* Paper texture: assets/paper.png is a seamless 512px tile generated
     to match the Figma Fine cotton paper shader as rendered, measured
     from the Figma screenshot. Paper #F7F4ED, fiber #A39C8C, grain
     strength 0.37, grain scale 1, unevenness 0.73, texture depth 0.85,
     texture scale 1.34, seed 0. Measured Figma background: mean
     247, 244, 238, std about 3.8 per channel. This tile: mean
     246, 243, 237, std about 3.8 per channel. The earlier light SVG
     grain overlay was too faint to see, opacity 0.07, so it is
     removed and the tile carries the texture instead. */
  main {
    position: relative;
    width: 100%;
    max-width: 620px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
    text-align: center;
  }
  h1, p {
    margin: 0;
    font-weight: 400;
    font-size: 28px;
    line-height: 31px;
    letter-spacing: -0.56px;
    text-transform: uppercase;
  }
  h1 .line { display: inline-block; white-space: nowrap; }
  figure {
    margin: 0;
    width: 100%;
    position: relative;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }
  .cta {
    display: inline-block;
    background: #d24942;
    color: #fff;
    font-family: "Courier Prime", "Courier New", monospace;
    font-size: 20px;
    line-height: 24px;
    letter-spacing: -0.56px;
    text-decoration: none;
    padding: 16px;
    border-radius: 999px;
    text-transform: none;
  }
  .cta:hover { opacity: 0.9; }
  .cta:focus-visible { outline: 2px solid #d24942; outline-offset: 3px; }
  @media (max-width: 700px) {
    body { padding: 20px; }
    main { gap: 28px; }
    h1, p { font-size: 24px; line-height: 27px; }
    .cta { font-size: 18px; line-height: 22px; }
  }
